apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daybrew-fe
  namespace: daybrew
spec:
  ingressClassName: nginx
  rules:
    - host: daybrew.duckdns.org
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: daybrew
                port:
                  number: 80
          - path: /oauth2/
            pathType: Prefix
            backend:
              service:
                name: daybrew
                port:
                  number: 80
          - path: /login/oauth2/
            pathType: Prefix
            backend:
              service:
                name: daybrew
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daybrew-fe
                port:
                  number: 80
