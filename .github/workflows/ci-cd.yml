name: CI/CD — FE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  build:
    name: Build & Push
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yoon6yo/devbrew-fe:latest
            ghcr.io/yoon6yo/devbrew-fe:sha-${{ github.sha }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.K8S_SSH_HOST }}
          port: ${{ secrets.K8S_SSH_PORT }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            curl -fs https://raw.githubusercontent.com/yoon6yo/devbrew-fe/${DEPLOY_SHA}/k8s/deployment.yaml \
              | sed "s|image: ghcr.io/yoon6yo/devbrew-fe:.*|image: ghcr.io/yoon6yo/devbrew-fe:sha-${DEPLOY_SHA}|" \
              | kubectl apply -f -
            curl -fs https://raw.githubusercontent.com/yoon6yo/devbrew-fe/${DEPLOY_SHA}/k8s/service.yaml | kubectl apply -f -
            curl -fs https://raw.githubusercontent.com/yoon6yo/devbrew-fe/${DEPLOY_SHA}/k8s/ingress.yaml | kubectl apply -f -
            kubectl rollout status deployment/daybrew-fe -n daybrew --timeout=120s
