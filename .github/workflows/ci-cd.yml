name: CI/CD — FE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/yoon6yo/devbrew-fe:latest

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_SSH_HOST }}
          port: ${{ secrets.K8S_SSH_PORT }}
          username: ${{ secrets.K8S_SSH_USER }}
          key: ${{ secrets.K8S_SSH_KEY }}
          script: |
            kubectl set image deployment/devbrew-fe \
              devbrew-fe=ghcr.io/yoon6yo/devbrew-fe:latest \
              -n devbrew
            kubectl rollout status deployment/devbrew-fe \
              -n devbrew --timeout=120s
